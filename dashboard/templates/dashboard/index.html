{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Futures Analytics Platform</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            --bg-primary: #0b0f14;
            --bg-secondary: #0f172a;
            --bg-tertiary: #0b1220;
            --border: #1e293b;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #0ea5e9;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 16px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status.connected {
            background: var(--success);
            color: var(--bg-primary);
        }
        
        .status.disconnected {
            background: var(--danger);
        }
        
        .controls {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        input, select, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
        }
        
        button {
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        button.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }
        
        button.danger {
            background: var(--danger);
            border-color: var(--danger);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
        }
        
        .chart-container {
            height: 300px;
            width: 100%;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        
        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .alerts-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .alert-item {
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--warning);
        }
        
        .alert-item.triggered {
            border-left-color: var(--danger);
        }
        
        .log {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Binance Futures Analytics Platform</h1>
            <div>
                <span class="status disconnected" id="status">Disconnected</span>
                <span style="margin-left: 12px; color: var(--text-secondary);" id="stats">
                    Buffered: 0
                </span>
            </div>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <div class="control-item">
                    <label>Symbols (comma-separated)</label>
                    <input type="text" id="symbols" value="btcusdt,ethusdt" placeholder="btcusdt,ethusdt">
                </div>
                <div class="control-item">
                    <label>Timeframe</label>
                    <select id="timeframe">
                        <option value="1s">1 Second</option>
                        <option value="1m" selected>1 Minute</option>
                        <option value="5m">5 Minutes</option>
                    </select>
                </div>
                <div class="control-item">
                    <label>Window Size</label>
                    <input type="number" id="window" value="100" min="10" max="1000">
                </div>
                <div class="control-item" style="justify-content: flex-end; flex-direction: row; gap: 8px;">
                    <button class="primary" id="start">Start</button>
                    <button class="danger" id="stop">Stop</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-item">
                    <label>Export Format</label>
                    <select id="exportFormat">
                        <option value="csv">CSV</option>
                        <option value="ndjson">NDJSON</option>
                    </select>
                </div>
                <div class="control-item">
                    <button id="export">Export Data</button>
                </div>
                <div class="control-item">
                    <input type="file" id="uploadFile" accept=".csv" style="display: none;">
                    <button onclick="document.getElementById('uploadFile').click()">Upload OHLC</button>
                </div>
            </div>
        </div>
        
        <div class="alerts-panel">
            <div class="card-header">
                <h3 class="card-title">Alert Rules</h3>
                <button class="primary" id="addAlert">Add Alert</button>
            </div>
            <div id="alertsList"></div>
        </div>
        
        <div class="grid">
            <div class="card full-width">
                <div class="card-header">
                    <h3 class="card-title">Price Chart</h3>
                    <select id="priceChartSymbol">
                        <option value="">Select Symbol</option>
                    </select>
                </div>
                <div class="chart-container" id="priceChart"></div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Z-Score</h3>
                </div>
                <div class="chart-container" id="zScoreChart"></div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Pair Spread (Symbol1 - Symbol2)</h3>
                    <small style="color: var(--text-secondary); font-size: 11px;">Price difference for pairs trading</small>
                </div>
                <div class="chart-container" id="spreadChart"></div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Price Statistics</h3>
                </div>
                <div class="stats-grid" id="priceStats"></div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Correlation</h3>
                </div>
                <div class="chart-container" id="correlationChart"></div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Hedge Ratio (OLS)</h3>
                </div>
                <div class="chart-container" id="hedgeRatioChart"></div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Activity Log</h3>
                <button id="clearLog">Clear</button>
            </div>
            <div class="log" id="log"></div>
        </div>
    </div>
    
    <script src="{% static 'dashboard/main.js' %}"></script>
</body>
</html>
